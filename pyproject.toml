[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mrs_pipeline"
version = "0.1.0"
description = "Analysis pipeline for MRS data from the amblyopia plasticity study"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENCE.md" }
dependencies = [
    "pandas",
    "joblib",
]

[tool.setuptools.packages.find]
where = ["src"]
