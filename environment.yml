# Environment used to run the MRS pipeline.
#
# FSL itself (fsl_anat, bet, fslmaths, svs_segment, ...) is installed
# separately: https://fsl.fmrib.ox.ac.uk/fsl/docs/install/
#
# Create with:   conda env create -f environment.yml
name: mrs_pipeline
channels:
  - https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/public/
  - conda-forge

dependencies:
  - python=3.10   # TODO: confirm (exact version used on the cluster)

  # MRS tools. scripts/fsl_mrs_preproc_edit.py needs fsl_mrs <= 2.0.9.
  - fsl_mrs=2.0.9 # TODO: confirm exact version used for the paper
  - spec2nii=0.7.4

  # Python package dependencies (src/mrs_pipeline)
  - pandas
  - joblib

  # Notebook
  - jupyterlab
  - ipykernel
