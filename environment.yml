name: mrs_pipeline
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.10

  # Scientific stack
  - numpy
  - pandas
  - scipy

  # Parallel processing
  - joblib

  # Optional (for notebook usage)
  - jupyterlab
  - ipykernel
  - matplotlib

  # MRS / neuroimaging Python packages
  - nibabel
  - fslpy

  # pip-only packages
  - pip
  - pip:
      - nifti-mrs
      - spec2nii